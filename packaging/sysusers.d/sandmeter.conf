# Group whose members may use the sandmeter service. Membership lets a user
# run commands in sandboxes within the operator's ceiling
# (/etc/sandmeter/config.toml) and use the budgets set there; it grants
# nothing else. No user account is created: the two service ids sandmeter
# runs its unprivileged helpers under are plain numbers above the sandbox id
# range and have no entry here.
g sandmeter - -
