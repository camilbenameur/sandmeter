name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The backends need root. These tests create namespaces, cgroups, overlay
  # mounts and network devices, so they only run on throwaway CI machines.
  # One job per group: if a test takes the runner down, the others still report.
  integration:
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cgroup, pkg: ./internal/cgroup, run: "." }
          - { name: seccomp, pkg: ./internal/seccomp, run: "." }
          - { name: image, pkg: ./image, run: "." }
          - { name: receipt, pkg: ./receipt, run: "." }
          - { name: netpolicy, pkg: ./netpolicy, run: "." }
          - { name: engine-native, pkg: ./engine, run: "/native$" }
          - { name: engine-gvisor, pkg: ./engine, run: "/gvisor$" }
    env:
      SANDMETER_NET_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Host report
        run: scripts/probe/host.sh
      - name: Prepare the runner (gVisor, forwarding)
        run: scripts/ci/setup-host.sh
      - name: Tests as root
        shell: bash
        # -exec runs the compiled test binary through sudo, from its package directory.
        run: |
          go test -exec "sudo -E" -race -tags integration -count=1 -timeout 10m -v \
            -run '${{ matrix.run }}' ${{ matrix.pkg }}
