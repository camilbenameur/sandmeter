name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The backends need root. These tests create namespaces, cgroups, overlay
  # mounts and network devices, so they only run on throwaway CI machines.
  integration:
    runs-on: ubuntu-latest
    env:
      RINGFENCE_NET_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Host report
        run: scripts/probe/host.sh
      - name: Prepare the runner (gVisor, forwarding)
        run: scripts/ci/setup-host.sh
      - name: Tests as root
        # -exec runs each compiled test binary through sudo, from its package directory.
        run: go test -exec "sudo -E" -race -tags integration -count=1 -v ./... 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-log
          path: integration.log
